[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cliptool"
version = "0.1.0"
description = "Find the best clips in a YouTube video, cut and format them for Shorts/Reels/TikTok."
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]>=2025.11.0",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
    "opencv-python-headless>=4.8,<4.11",  # 4.11+ wheels no longer bundle the Haar face model
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
ai = ["anthropic>=0.70"]   # optional: Claude ranking, only with an API key and --ai
dev = ["pytest>=8"]

[project.scripts]
cliptool = "cliptool.cli:main"

[tool.setuptools]
packages = ["cliptool"]

[tool.setuptools.package-data]
cliptool = ["static/*"]
